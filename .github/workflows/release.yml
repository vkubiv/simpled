name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  # The controller image goes to ghcr.io/vkubiv/simpled.
  packages: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          # Extract version from Cargo.toml
          VERSION=$(grep "^version" Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: get-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: simpled
            asset_name: simpled_linux_amd64
          # Built natively on GitHub's arm64 runner. Swarm targets with
          # target_platform: linux-arm64 download this one.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: simpled
            asset_name: simpled_linux_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: simpled.exe
            asset_name: simpled_windows_amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: simpled
            asset_name: simpled_macos_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: simpled
            asset_name: simpled_macos_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Import signing certificates (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT_PATH="$RUNNER_TEMP/app_certificate.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the base64-encoded certs:
          #   - Developer ID Application -> signs the binary
          #   - Developer ID Installer   -> signs the .pkg
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$APP_CERT_PATH"
          echo -n "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode -o "$INSTALLER_CERT_PATH"

          # Create a temporary keychain and import both certs into it.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Package, notarize, and staple (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          STAGING="$RUNNER_TEMP/pkgroot"
          PKG_PATH="$RUNNER_TEMP/${{ matrix.asset_name }}.pkg"

          # Decode the App Store Connect API key (.p8).
          echo -n "$APPLE_API_KEY" | base64 --decode -o "$KEY_PATH"

          # Stage the already-signed binary at its install location.
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/${{ matrix.binary_name }}"
          chmod +x "$STAGING/${{ matrix.binary_name }}"

          # Build a signed installer package that drops the binary in /usr/local/bin.
          # pkgbuild --version dislikes the leading "v", so strip it.
          PKG_VERSION="${VERSION#v}"
          pkgbuild \
            --root "$STAGING" \
            --identifier com.simpled.cli \
            --version "$PKG_VERSION" \
            --install-location /usr/local/bin \
            --sign "$MACOS_INSTALLER_SIGNING_IDENTITY" \
            "$PKG_PATH"

          # Notarize the signed package and block until Apple finishes.
          # Fails the job if the result is not "Accepted".
          xcrun notarytool submit "$PKG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          # A .pkg can be stapled, so Gatekeeper verifies the notarization
          # offline — no "could not verify ... free of malware" dialog.
          xcrun stapler staple "$PKG_PATH"

          # Hand the finished package off to the upload step.
          mkdir -p dist
          cp "$PKG_PATH" "dist/${{ matrix.asset_name }}.pkg"

      - name: Upload package (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.pkg
          path: dist/${{ matrix.asset_name }}.pkg

      - name: Archive binary for self-update (macOS)
        if: runner.os == 'macOS'
        run: |
          # `simpled update` pulls a tarball, not the .pkg, so ship both.
          # This is the same signed binary that went into the package, and
          # notarizing the package registered its cdhash, so Gatekeeper
          # accepts it when it arrives this way too.
          mkdir -p dist
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Upload tarball (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.tar.gz
          path: dist/${{ matrix.asset_name }}.tar.gz

      - name: Prepare binary for release (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Upload binary (Linux/Windows)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.tar.gz
          path: dist/${{ matrix.asset_name }}.tar.gz

  # The controller image's binaries: static (musl), so they run on an empty base.
  controller-binary:
    name: Build controller ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binary
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/simpled dist/simpled_linux_${{ matrix.arch }}
          file dist/simpled_linux_${{ matrix.arch }} | grep -q 'static' || { echo "::error::not a static binary"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: controller_linux_${{ matrix.arch }}
          path: dist/simpled_linux_${{ matrix.arch }}

  # ghcr.io/vkubiv/simpled:<version>, which prepare-deployment pins the
  # gateway's controller to. Built before the release is published, so a version
  # never points at an image that is missing.
  controller-image:
    name: Controller image
    needs: [get-version, controller-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: controller_linux_*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/simpled_linux_*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vkubiv/simpled:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/vkubiv/simpled
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

  release:
    name: Create Release
    needs: [get-version, build, controller-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          # Only the files the release ships: the controller binaries go into the
          # image, and docker/build-push-action adds a build record
          # (*.dockerbuild) that download-artifact cannot extract.
          pattern: simpled_*
          path: artifacts
          merge-multiple: true

      - name: Write checksums
        # `simpled update` refuses to install a binary whose digest is not listed
        # here, so this file has to ship with every release.
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Find release notes
        # docs/releases/<version>.md, when there is one, goes above the generated
        # list of pull requests.
        id: notes
        run: |
          NOTES="docs/releases/${VERSION#v}.md"
          if [ -f "$NOTES" ]; then echo "path=$NOTES" >> $GITHUB_OUTPUT; fi
        env:
          VERSION: ${{ needs.get-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          files: artifacts/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
