[package]
name = "simpled"
version = "2.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
# Reads the `secrets_json` document. A field path is resolved here rather than by
# shelling out to jq, so a local stack needs nothing installed.
serde_json = "1.0"
anyhow = "1.0"
semver = "1.0.27"
tar = "0.4"
flate2 = "1.0"
base64 = "0.22"
sha2 = "0.10"
# default-features off: the local gateway proxies plain HTTP, and the `tls` default pulls
# in a second rustls crypto provider (aws-lc-rs next to reqwest's ring), which makes
# rustls panic at the first connection until one is chosen explicitly.
axum-reverse-proxy = { version = "1.0", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "signal", "macros"] }
ctrlc = "3.4"
axum = "0.8.8"
# default-features off keeps native-tls (and so OpenSSL on Linux) out of the build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# The daemon reads services and containers through the Docker API. The default
# features are the Unix socket and the Windows named pipe; no TLS.
bollard = "0.21.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.8"
tower = { version = "0.5", features = ["util"] }

# Smaller, faster release binaries; the tarball ships this straight to users.
[profile.release]
lto = true
codegen-units = 1
strip = true
