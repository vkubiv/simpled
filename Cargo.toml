[package]
name = "simpled"
version = "1.3.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
semver = "1.0.27"
tar = "0.4"
flate2 = "1.0"
base64 = "0.22"
axum-reverse-proxy = { version = "1.0", features = [] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net"] }
axum = "0.8.8"
# default-features off keeps native-tls (and so OpenSSL on Linux) out of the build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3.8"

# Smaller, faster release binaries; the tarball ships this straight to users.
[profile.release]
lto = true
codegen-units = 1
strip = true
