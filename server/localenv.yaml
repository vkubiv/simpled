# Local development environment for the `simpled-server` bundle (type: local is implied here).
# `just run` from this directory. Secrets come from ./secrets (gitignored) — `just secrets-init` seeds them.

# Host ports, named so several instances can run side by side: `--instance N`, SIMPLED_INSTANCE or a
# `.simpled-instance` file shifts every one by N * 100 (instance 1: gateway 7180, db 7154, ...).
ports:
  gateway: 7080
  web: 7000
  app: 7001
  monitor: 7002
  mailer: 7025
  db: 7054
  fakes: 7010

gateway:
  name: simpled-server-local
  tls:
    disable: true
  hosts:
    app:
      - localhost:$port(gateway)

deployments:
  local:
    primary_host: app

    application:
      name: simpled-server
      extra:
        - ./local-infra.yaml

    secrets_folder: ./secrets
    secrets:
      db_password:
      sendgrid_apikey:
      github_token_key:

    # `{password}` is the .NET app's own placeholder (config/ConfigurationLoader.cs), not simpled's — keep it literal.
    # Every email goes to the mock mailer: http://localhost:$port(mailer) lists them.
    environment:
      - DB_CONNECTION_STRING="Host=simpled-db;Port=5432;Username=main_user;Password={password};Database=simpled"
      - SEND_GRID_API_HOST=http://simpled-mailer:3000
      - DEV_ENV=true
      - AUTH_RATE_LIMIT_PER_MINUTE=1000
      # GitHub and every monitored deployment are simpled-fakes here (local-infra.yaml); the e2e suite sets them up.
      - GITHUB_API_URL=http://simpled-fakes:3000
      - PROBE_PROXY_URL=http://simpled-fakes:3000
      - MONITOR_INTERVAL_SECONDS=2
      - REPOSITORY_SYNC_INTERVAL_SECONDS=30
    undockerized_environment:
      - DB_CONNECTION_STRING="Host=localhost;Port=$port(db);Username=main_user;Password={password};Database=simpled"
      - SEND_GRID_API_HOST=http://localhost:$port(mailer)
      - GITHUB_API_URL=http://localhost:$port(fakes)
      - PROBE_PROXY_URL=http://localhost:$port(fakes)

    services:
      main-svc:
        host: app
        prefix: /api
        strip_prefix: true
        ports:
          - "$port(app):80"
        working_dir: ./backend_services/main-svc
      monitor-svc:
        ports:
          - "$port(monitor):80"
        working_dir: ./backend_services/monitor-svc
      # Excluded in `infra`, where the gateway sends `/` to the Vite dev server on the same port (`just web-dev`).
      web-app:
        host: app
        prefix: /
        ports:
          - "$port(web):80"

  # Gateway + Postgres + mock mailer only; run main-svc from the IDE and the web app with `just web-dev` against them
  # (migrate with `just apply-migrations`). The IDE's launch profile and Vite listen on 7001 and 7000: instance 0.
  infra:
    extends: local
    exclude_services:
      - main-svc
      - monitor-svc
      - web-app
      - db-setup
