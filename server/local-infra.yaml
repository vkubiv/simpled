extra_services:
  simpled-db:
    type: internal
    image: postgres:17-alpine
    ports:
      - "$port(db):5432"
    environment:
      - POSTGRES_USER=main_user
      - POSTGRES_PASSWORD_FILE=/secrets/db_password
      - POSTGRES_DB=simpled
    secrets:
      - db_password
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main_user -d simpled"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Plays GitHub's API and the gateway of every monitored deployment (fakes/server.mjs); e2e tests script it
  # through http://localhost:$port(fakes)/_fakes. No image to build: the script is mounted.
  simpled-fakes:
    type: internal
    image: node:24.11.1-alpine
    command: ["node", "/fakes/server.mjs"]
    ports:
      - "$port(fakes):3000"
    volumes:
      - ../fakes:/fakes:ro

  # Catches every email; the web UI and GET /api/mails are on http://localhost:$port(mailer).
  simpled-mailer:
    type: internal
    image: ghashange/sendgrid-mock:1.9.0
    ports:
      - "$port(mailer):3000"
    environment:
      - API_KEY=sendgrid-mock-api-key
