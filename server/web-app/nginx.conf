server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # No /api here: the gateway routes it to main-svc before a request reaches this container.

    # Hashed bundles never change under a name; index.html always revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Emailed links carry single-use tokens in the query: keep them out of the access log and the Referer.
    location ~ ^/(confirm-email|reset-password|invitation)$ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # SPA fallback: React Router handles every other path.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
