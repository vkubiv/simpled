name: simpled-server
version: 0.1.0

# Topology only. Domains, registry, secret sources and env var VALUES live in localenv.yaml (local)
# and deployment envspecs. See `simpled docs agent`.

environment:
  external:
    - DB_CONNECTION_STRING          # contains a literal `{password}`; the .NET config loader substitutes the db_password secret itself
    - DEV_ENV=false
    - POSTMASTER_EMAIL="no-reply@example.com"
    - SEND_GRID_API_HOST="not-set"
    - SEND_GRID_MOCK_API_KEY="not-set"
    - SEND_GRID_MOCK_API_HOST="not-set"
  optional:
    - SENTRY_DSN                    # empty disables Sentry
    - CORS_ORIGINS                  # comma-separated browser origins, only when the web app is served from another origin
    - AUTH_RATE_LIMIT_PER_MINUTE    # per client IP on the auth endpoints; empty means 20
    - GITHUB_API_URL                # empty means https://api.github.com
    - PROBE_PROXY_URL               # local only: monitor-svc reaches every deployment through simpled-fakes
    - MONITOR_INTERVAL_SECONDS      # how often each deployment's version endpoint is checked; empty means 60
    - REPOSITORY_SYNC_INTERVAL_SECONDS  # how often linked repositories' spec files are re-read; empty means 600

  relative:
    - WEB_APP_URL="/"               # links in emails (confirm-email, reset-password, invitations)

secrets:
  db_password:
  sendgrid_apikey:
  github_token_key:                 # encrypts the GitHub tokens organizations save; changing it voids them

app_services:
  main-svc:
    type: public
    image: simpled-server/main-svc
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    environment:
      - $all
    secrets:
      - db_password
      - sendgrid_apikey
      - github_token_key

  # The React SPA (web-app/), static files on nginx. `/api` goes to main-svc, everything else here.
  web-app:
    type: public
    image: simpled-server/web-app
    export:
      host: app
      prefix: /
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Re-syncs linked repositories and checks every deployment's version endpoint. Run exactly one.
  monitor-svc:
    type: internal
    image: simpled-server/monitor-svc
    # /health fails once the monitor loop has stalled.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    environment:
      - $all
    secrets:
      - db_password
      - sendgrid_apikey
      - github_token_key

  db-setup:
    type: job
    image: simpled-server/db-setup
    environment:
      - $all
    secrets:
      - db_password
      - sendgrid_apikey
      - github_token_key
